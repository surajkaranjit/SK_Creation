<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SURAJ CREATION | Admin Panel</title>
    <style>
        :root {
            --bg-dark: #0A0D14;
            --panel-bg: #131824;
            --accent-blue: #00A3FF;
            --text-main: #FFFFFF;
            --text-muted: #94A3B8;
            --border-color: rgba(255, 255, 255, 0.08);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
        body { background: var(--bg-dark); color: var(--text-main); min-height: 100vh; }
        
        /* Login Screen */
        .login-wrap { display: flex; justify-content: center; align-items: center; height: 100vh; }
        .card { background: var(--panel-bg); border: 1px solid var(--border-color); padding: 30px; border-radius: 12px; width: 100%; max-width: 400px; }
        input, textarea { width: 100%; background: #0A0D14; border: 1px solid var(--border-color); color: #fff; padding: 12px; margin: 8px 0 16px; border-radius: 6px; }
        .btn { width: 100%; background: var(--accent-blue); color: #000; font-weight: 700; padding: 12px; border: none; border-radius: 6px; cursor: pointer; }

        /* Dashboard Screen */
        .dash-container { display: none; }
        .dash-layout { display: flex; min-height: 100vh; }
        .sidebar { width: 240px; background: var(--panel-bg); border-right: 1px solid var(--border-color); padding: 24px; }
        .brand { font-size: 1.2rem; font-weight: 800; margin-bottom: 30px; }
        .brand span { color: var(--accent-blue); }
        .menu-item { display: block; color: var(--text-muted); padding: 10px; margin-bottom: 5px; text-decoration: none; border-radius: 6px; cursor: pointer; }
        .menu-item.active { background: rgba(0, 163, 255, 0.1); color: var(--accent-blue); }
        .main-content { flex: 1; padding: 40px; }
        .section { display: none; }
        .section.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid var(--border-color); }
        th { color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="login-wrap">
        <div class="card">
            <h2 style="margin-bottom: 20px; text-align: center;">Admin Auth</h2>
            <form id="loginForm">
                <label>Username</label>
                <input type="text" id="username" required>
                <label>Password</label>
                <input type="password" id="password" required>
                <button type="submit" class="btn">Sign In</button>
            </form>
        </div>
    </div>

    <!-- DASHBOARD SCREEN -->
    <div id="dashScreen" class="dash-container">
        <div class="dash-layout">
            <aside class="sidebar">
                <div class="brand">SURAJ<span>ADMIN</span></div>
                <a class="menu-item active" onclick="showTab('videosTab', this)">Videos</a>
                <a class="menu-item" onclick="showTab('photosTab', this)">Photos</a>
                <a class="menu-item" onclick="showTab('inquiriesTab', this)">Inquiries</a>
                <a class="menu-item" onclick="logout()" style="color:#ff4d4d; margin-top: 30px;">Logout</a>
            </aside>

            <main class="main-content">
                <!-- VIDEOS SECTION -->
                <div id="videosTab" class="section active">
                    <h2>Manage Videos</h2>
                    <div class="card" style="max-width: 500px; margin-top: 20px;">
                        <form id="videoForm">
                            <input type="text" id="vTitle" placeholder="Title (e.g. Color Grade Pass)" required>
                            <input type="text" id="vUrl" placeholder="YouTube Embed URL" required>
                            <input type="text" id="vCat" placeholder="Category" required>
                            <button type="submit" class="btn">Add Video</button>
                        </form>
                    </div>
                    <table id="videosTable">
                        <thead><tr><th>Title</th><th>Category</th><th>Action</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>

                <!-- PHOTOS SECTION -->
                <div id="photosTab" class="section">
                    <h2>Manage Photography</h2>
                    <div class="card" style="max-width: 500px; margin-top: 20px;">
                        <form id="photoForm" enctype="multipart/form-data">
                            <input type="text" id="pCaption" placeholder="Caption" required>
                            <input type="text" id="pCat" placeholder="Category" required>
                            <textarea id="pDesc" placeholder="Description"></textarea>
                            <input type="file" id="pImg" accept="image/*" required>
                            <button type="submit" class="btn">Upload Photo</button>
                        </form>
                    </div>
                    <table id="photosTable">
                        <thead><tr><th>Caption</th><th>Category</th><th>Action</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>

                <!-- INQUIRIES SECTION -->
                <div id="inquiriesTab" class="section">
                    <h2>Client Inquiries</h2>
                    <table id="inquiriesTable">
                        <thead><tr><th>Name</th><th>Email</th><th>Phone</th><th>Message</th></tr></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <script>
        const API_BASE = 'https://suraj-backend-jq7k.onrender.com';

        let token = localStorage.getItem('jwtToken');
        if (token) showDashboard();

        function authHeaders() {
            return token ? { Authorization: `Bearer ${token}` } : {};
        }

        async function handleResponse(res) {
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || data.message || 'Request failed');
            return data;
        }

        async function safeFetch(url, options = {}) {
            const response = await fetch(url, options);
            if (response.status === 401 || response.status === 403) {
                logout();
                throw new Error('Session expired. Please sign in again.');
            }
            return handleResponse(response);
        }

        document.getElementById('loginForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                const res = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });
                const data = await handleResponse(res);
                token = data.token;
                localStorage.setItem('jwtToken', token);
                showDashboard();
            } catch (err) {
                alert(err.message || 'Login failed');
            }
        };

        function showDashboard() {
            document.getElementById('loginScreen').style.display = 'none';
            document.getElementById('dashScreen').style.display = 'block';
            loadVideos();
            loadPhotos();
            loadInquiries();
        }

        function logout() {
            localStorage.removeItem('jwtToken');
            token = null;
            location.reload();
        }

        function showTab(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.menu-item').forEach(m => m.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        // --- VIDEOS LOGIC ---
        async function loadVideos() {
            try {
                const data = await safeFetch(`${API_BASE}/api/videos`);
                document.querySelector('#videosTable tbody').innerHTML = data.map(v => `
                    <tr>
                        <td>${v.title}</td>
                        <td>${v.category}</td>
                        <td><button onclick="deleteVideo(${v.id})" style="color:red; background:none; border:none; cursor:pointer;">Delete</button></td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Unable to load videos:', err);
            }
        }

        document.getElementById('videoForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                await safeFetch(`${API_BASE}/api/admin/videos`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', ...authHeaders() },
                    body: JSON.stringify({
                        title: document.getElementById('vTitle').value,
                        youtube_url: document.getElementById('vUrl').value,
                        category: document.getElementById('vCat').value
                    })
                });
                document.getElementById('vTitle').value = '';
                document.getElementById('vUrl').value = '';
                document.getElementById('vCat').value = '';
                loadVideos();
            } catch (err) {
                alert(err.message || 'Could not save video');
            }
        };

        async function deleteVideo(id) {
            try {
                await safeFetch(`${API_BASE}/api/admin/videos/${id}`, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                loadVideos();
            } catch (err) {
                alert(err.message || 'Could not delete video');
            }
        }

        // --- PHOTOS LOGIC ---
        async function loadPhotos() {
            try {
                const data = await safeFetch(`${API_BASE}/api/photos`);
                document.querySelector('#photosTable tbody').innerHTML = data.map(p => `
                    <tr>
                        <td>${p.caption}</td>
                        <td>${p.category}</td>
                        <td><button onclick="deletePhoto(${p.id})" style="color:red; background:none; border:none; cursor:pointer;">Delete</button></td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Unable to load photos:', err);
            }
        }

        document.getElementById('photoForm').onsubmit = async (e) => {
            e.preventDefault();
            try {
                const formData = new FormData();
                formData.append('caption', document.getElementById('pCaption').value);
                formData.append('category', document.getElementById('pCat').value);
                formData.append('description', document.getElementById('pDesc').value);
                formData.append('image', document.getElementById('pImg').files[0]);

                await safeFetch(`${API_BASE}/api/admin/photos`, {
                    method: 'POST',
                    headers: authHeaders(),
                    body: formData
                });
                document.getElementById('pCaption').value = '';
                document.getElementById('pCat').value = '';
                document.getElementById('pDesc').value = '';
                document.getElementById('pImg').value = '';
                loadPhotos();
            } catch (err) {
                alert(err.message || 'Could not upload photo');
            }
        };

        async function deletePhoto(id) {
            try {
                await safeFetch(`${API_BASE}/api/admin/photos/${id}`, {
                    method: 'DELETE',
                    headers: authHeaders()
                });
                loadPhotos();
            } catch (err) {
                alert(err.message || 'Could not delete photo');
            }
        }

        // --- INQUIRIES LOGIC ---
        async function loadInquiries() {
            try {
                const data = await safeFetch(`${API_BASE}/api/admin/inquiries`, { headers: authHeaders() });
                document.querySelector('#inquiriesTable tbody').innerHTML = data.map(i => `
                    <tr>
                        <td>${i.name}</td>
                        <td>${i.email}</td>
                        <td>${i.phone}</td>
                        <td>${i.message}</td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error('Unable to load inquiries:', err);
            }
        }
    </script>
</body>
</html>
